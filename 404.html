<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrong turn · Abhinav Harisri</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <meta name="theme-color" content="#f7f4ef">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #1d1b18;
      --ink-soft: rgba(29, 27, 24, 0.65);
      --glow: #b0601c;
      --paper: #f7f4ef;
    }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    main {
      min-height: 100%;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 0 20px;
    }

    .code {
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--ink-soft);
    }

    h1 {
      margin: 16px 0 18px;
      font-weight: 500;
      font-size: clamp(44px, 7vw, 88px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    h1 em { color: var(--glow); font-style: normal; }

    p { color: var(--ink-soft); font-size: 15px; }

    .home {
      display: inline-block;
      margin-top: 32px;
      font-size: 15px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--ink);
      transition: color .2s, border-color .2s;
    }

    .home:hover { color: var(--glow); border-color: var(--glow); }
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>Wrong <em>turn</em>.</h1>
    <p>This page doesn't exist.</p>
    <div><a class="home" href="/">← back to the start</a></div>
  </main>
</body>
</html>
